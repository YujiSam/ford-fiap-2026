<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP: só scripts/estilos do próprio site; requisições apenas para a API -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:8000; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Ford Inteligência Competitiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Inteligência Competitiva</h1>
            <p>Busque especificações técnicas de veículos</p>
        </div>

        <div class="card" id="loginSection">
            <h2>🔐 Login</h2>
            <div class="form-group">
                <label for="usuario">Usuário:</label>
                <input type="text" id="usuario" maxlength="50" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" maxlength="128" autocomplete="current-password">
            </div>
            <button id="btnLogin" class="btn btn-primary">🔑 Entrar</button>
            <div id="loginErro" class="erro" hidden></div>
        </div>

        <div class="card" id="buscaSection" hidden>
            <div class="user-info">
                <span>👤 <span id="usuarioLogado"></span></span>
                <button id="btnLogout" class="btn-logout">🚪 Sair</button>
            </div>
            <h2>🔍 Buscar Veículo</h2>
            <div class="form-row">
                <div class="form-group"><label for="marca">Marca:</label><input type="text" id="marca" maxlength="50" value="Ford"></div>
                <div class="form-group"><label for="modelo">Modelo:</label><input type="text" id="modelo" maxlength="50" value="Ranger"></div>
                <div class="form-group"><label for="versao">Versão:</label><input type="text" id="versao" maxlength="50" value="Raptor"></div>
            </div>
            <div class="form-group">
                <label for="atributos">Atributos específicos (opcional - separados por vírgula):</label>
                <input type="text" id="atributos" placeholder="Ex: potencia, preco, motor">
            </div>
            <div class="button-group">
                <button id="btnBuscar" class="btn btn-success">🔍 Buscar</button>
                <button id="btnLimpar" class="btn btn-secondary">🗑️ Limpar</button>
            </div>
            <div id="resultado" class="resultado"></div>
        </div>

        <div class="footer"><p>Ford FIAP 2026 | Cybersecurity & Inteligência Competitiva</p></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
